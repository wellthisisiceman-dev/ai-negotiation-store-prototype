<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HaggleStore - AI Negotiation Marketplace</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --accent: #ff4d4d;
    --text: #f0f0f0;
    --muted: #888;
    --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1rem 2rem;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.4rem; }
  header h1 span { color: var(--accent); }
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
  .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }
  .product {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .product:hover { transform: translateY(-4px); }
  .product img { width: 100%; height: 220px; object-fit: cover; background: #222; }
  .product-info { padding: 1rem; }
  .product-info h3 { margin-bottom: 0.5rem; }
  .price { color: var(--muted); font-size: 0.9rem; }
  .max-price { color: var(--accent); font-weight: bold; }

  /* Modal / Negotiation */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal.active { display: flex; }
  .nego-box {
    background: #111;
    border-radius: 16px;
    width: 90%;
    max-width: 900px;
    height: 80vh;
    display: flex;
    overflow: hidden;
  }
  .product-preview {
    width: 45%;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    border-right: 1px solid #333;
  }
  .product-preview img { max-width: 100%; max-height: 50%; border-radius: 8px; margin-bottom: 1rem; }
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .avatar-header {
    padding: 1rem;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff4d4d, #ff8c00);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .messages {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .msg {
    max-width: 80%;
    padding: 0.75rem 1rem;
    border-radius: 12px;
    line-height: 1.4;
  }
  .msg.ai { background: #222; align-self: flex-start; }
  .msg.user { background: var(--accent); align-self: flex-end; color: white; }
  .input-area {
    padding: 1rem;
    border-top: 1px solid #333;
    display: flex;
    gap: 0.5rem;
  }
  input, button {
    padding: 0.75rem 1rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
  }
  input { flex: 1; background: #222; color: white; }
  button {
    background: var(--accent);
    color: white;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  .close-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: #333;
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
  }
  .deal {
    background: var(--success) !important;
    color: #000 !important;
    font-weight: bold;
  }
</style>
</head>
<body>
<header>
  <h1>Haggle<span>Store</span></h1>
  <div>AI Negotiation Marketplace</div>
</header>

<div class="container">
  <h2 style="margin-bottom: 1.5rem;">Featured Hoodies</h2>
  <div class="products" id="products"></div>
</div>

<div class="modal" id="modal">
  <button class="close-btn" onclick="closeModal()">×</button>
  <div class="nego-box">
    <div class="product-preview">
      <img id="preview-img" src="" alt="">
      <h3 id="preview-name"></h3>
      <p class="price">Listed from <span class="max-price" id="preview-max"></span></p>
      <p style="margin-top:1rem; color:#666; font-size:0.85rem;">Negotiate with our AI salesperson. Margins protected — floor never revealed.</p>
    </div>
    <div class="chat-area">
      <div class="avatar-header">
        <div class="avatar">AI</div>
        <div>
          <strong>Alex the Negotiator</strong><br>
          <small style="color:#888;">Skilled, slightly sassy, always fair</small>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input id="offer-input" type="number" placeholder="Your offer (e.g. 650)" min="1">
        <button onclick="sendOffer()">Offer</button>
        <button onclick="sendMessage()" style="background:#333;">Chat</button>
      </div>
    </div>
  </div>
</div>

<script>
const products = [
  { id: 1, name: "Classic Black Hoodie", max: 899, min: 499, img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400&h=400&fit=crop" },
  { id: 2, name: "Oversized Cream Hoodie", max: 999, min: 549, img: "https://images.unsplash.com/photo-1578587018452-892b1fd5a0f4?w=400&h=400&fit=crop" },
  { id: 3, name: "Streetwear Zip Hoodie", max: 1099, min: 599, img: "https://images.unsplash.com/photo-1509942774463-acf339cf87d5?w=400&h=400&fit=crop" },
  { id: 4, name: "Minimalist Grey Hoodie", max: 799, min: 449, img: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?w=400&h=400&fit=crop" }
];

let currentProduct = null;
let currentPrice = null;
let rounds = 0;

function renderProducts() {
  const el = document.getElementById('products');
  el.innerHTML = products.map(p => `
    <div class="product" onclick="openNego(${p.id})">
      <img src="${p.img}" alt="${p.name}">
      <div class="product-info">
        <h3>${p.name}</h3>
        <p class="price">Up to <span class="max-price">₹${p.max}</span></p>
        <p style="font-size:0.8rem; color:#666; margin-top:0.5rem;">Click to negotiate</p>
      </div>
    </div>
  `).join('');
}

function openNego(id) {
  currentProduct = products.find(p => p.id === id);
  currentPrice = currentProduct.max;
  rounds = 0;
  document.getElementById('preview-img').src = currentProduct.img;
  document.getElementById('preview-name').textContent = currentProduct.name;
  document.getElementById('preview-max').textContent = '₹' + currentProduct.max;
  document.getElementById('messages').innerHTML = '';
  addMsg('ai', `Hey! Looking at the ${currentProduct.name}. Listed up to ₹${currentProduct.max}. What's your offer? I negotiate hard but fair.`);
  document.getElementById('modal').classList.add('active');
  document.getElementById('offer-input').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function addMsg(who, text, isDeal = false) {
  const div = document.createElement('div');
  div.className = `msg ${who}${isDeal ? ' deal' : ''}`;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = 9999;
}

function sendOffer() {
  const input = document.getElementById('offer-input');
  const offer = parseInt(input.value);
  if (!offer || offer < 1) return;
  input.value = '';
  addMsg('user', `I'll offer ₹${offer}`);
  rounds++;

  setTimeout(() => respondToOffer(offer), 600);
}

function sendMessage() {
  const input = document.getElementById('offer-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  setTimeout(() => {
    addMsg('ai', "I hear you. Still, let's talk numbers. What's your best offer?");
  }, 500);
}

function respondToOffer(offer) {
  const min = currentProduct.min;
  const max = currentProduct.max;

  if (offer >= max) {
    addMsg('ai', `Deal at ₹${offer}! That's full price — bold move. Adding to cart.`, true);
    return;
  }

  if (offer < min) {
    // Never reveal the floor
    const counter = Math.max(min, Math.round(offer * 1.15 + 50));
    const safeCounter = Math.min(max - 20, Math.max(min + 20, counter));
    addMsg('ai', `₹${offer} doesn't work for me. I can do ₹${safeCounter} — that's as far as I'm going on this one.`);
    return;
  }

  // Within range: concede slowly
  const gap = max - offer;
  let counter;
  if (rounds === 1) counter = Math.round(max - gap * 0.25);
  else if (rounds === 2) counter = Math.round(max - gap * 0.5);
  else counter = Math.round((offer + max) / 2);

  counter = Math.max(min + 10, Math.min(max - 10, counter));

  if (offer >= counter - 30 || rounds >= 4) {
    addMsg('ai', `Alright, ₹${offer} it is. Deal locked. Nice negotiation.`, true);
  } else {
    const sassy = ["You're pushing it.", "That's aggressive.", "I like the energy, but...", "Hmm, not quite."][rounds % 4];
    addMsg('ai', `${sassy} How about ₹${counter}?`);
  }
}

renderProducts();

document.getElementById('offer-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') sendOffer();
});
</script>
</body>
</html>
